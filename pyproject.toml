[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-optimizer"
version = "0.1.0"
description = "Herramienta gráfica para optimizar y administrar el rendimiento de Linux"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
]

[project.scripts]
linux-optimizer = "linux_optimizer.app:main"
cortex-gaming-engine = "cortex_engine.main:main"

[tool.setuptools.packages.find]
include = ["linux_optimizer*", "cortex_engine*"]

[tool.setuptools.package-data]
"cortex_engine.interface" = ["theme.qss"]
"linux_optimizer.resources" = ["*.svg", "*.ico"]

[project.optional-dependencies]
build-windows = ["pyinstaller>=6.10"]
