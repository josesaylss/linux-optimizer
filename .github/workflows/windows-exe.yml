name: Compilar .exe de Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/windows/requirements-build.txt

      - name: Generar icono
        run: python packaging/windows/make_icon.py

      - name: Empaquetar con PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/windows/linux-optimizer.spec

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: LinuxOptimizer-exe
          path: dist/LinuxOptimizer.exe
          if-no-files-found: error
